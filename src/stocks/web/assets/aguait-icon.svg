  <path fill="#60A5FA" d="M8 43 Q32 25 56 43 Q32 61 8 43 Z"/>
  <circle cx="32" cy="43" r="8.5" fill="#FFFFFF"/>
  <circle cx="32" cy="43" r="4" fill="#34D399"/>
</svg>
