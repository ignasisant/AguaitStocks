name = "aguait-telegram-webhook"
main = "worker.js"
compatibility_date = "2026-08-01"

# Same bucket as [storage] / STOCKS_STORAGE_BUCKET — the queue lives next to
# the mirrored user data, under data/tg_updates/.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aguait-user-data"

[vars]
GITHUB_REPO = "ignasisant/AguaitStocks"

# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   WEBHOOK_SECRET — random string; also passed to setWebhook as secret_token
#   GITHUB_PAT     — fine-grained PAT, repo AguaitStocks, Contents: read+write
