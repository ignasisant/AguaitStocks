[project]
name = "stocks"
version = "0.1.0"
description = "Personal stock tracking: data fetch, indicators, alerts, dashboard"
readme = "README.md"
authors = [
    { name = "Ignasi", email = "ignasi.sant@hotmail.es" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "authlib>=1.3.2",
    "boto3>=1.35",
    "cryptography>=43",
    "ddgs>=9.15.0",
    "google-genai>=1.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "model2vec>=0.9.0",
    "openai>=1.60",
    "openpyxl>=3.1",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    "streamlit>=1.60.0",
    "tiktoken>=0.14.0",
    "trafilatura>=2.2.0",
    "yfinance>=1.5.2",
]

[project.optional-dependencies]
# Unofficial TradingView TA consensus (stocks.data.tradingview). Opt-in: scrapes
# an undocumented endpoint, may break without notice, personal use only.
tv = ["tradingview-ta>=3.3.0"]

[project.scripts]
stocks = "stocks.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "watchdog>=6.0.0",
]
