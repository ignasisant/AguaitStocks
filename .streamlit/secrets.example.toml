# Copy to .streamlit/secrets.toml (git-ignored) and fill in.
#
# Google OIDC login for the web app (st.login / st.user).
#
# Setup:
#   1. https://console.cloud.google.com/apis/credentials
#      -> Create credentials -> OAuth client ID -> Web application
#   2. Authorized redirect URI (local dev):
#        http://localhost:8501/oauth2callback
#      When deployed, add the deployed URL + /oauth2callback here AND in
#      redirect_uri below.
#   3. cookie_secret: any strong random string, e.g.
#        python -c "import secrets; print(secrets.token_hex(32))"

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE-WITH-RANDOM-HEX"
client_id = "REPLACE-WITH-CLIENT-ID.apps.googleusercontent.com"
client_secret = "REPLACE-WITH-CLIENT-SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[app]
# Optional. This account maps to the repo-root watchlist.yaml and
# data/portfolio.db (shared with the CLI) instead of data/users/<slug>/.
# Leave commented out to keep every account under data/users/.
# owner_email = "you@example.com"

# Optional. S3-compatible bucket that persists user data (watchlists,
# portfolio ledgers, prefs) across restarts — required on hosts with an
# ephemeral filesystem (containers, Streamlit Community Cloud), pointless
# locally. Works with Cloudflare R2 (shown), AWS S3 or MinIO. Every value
# can also come from env vars: STOCKS_STORAGE_BUCKET etc. (env wins).
# [storage]
# endpoint_url = "https://<account-id>.r2.cloudflarestorage.com"
# bucket = "aguait-user-data"
# access_key_id = "REPLACE"
# secret_access_key = "REPLACE"
# region = "auto"          # default; e.g. "eu-west-1" for AWS S3
