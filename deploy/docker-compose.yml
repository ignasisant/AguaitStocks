# TopStocks — Oracle Cloud Always Free VM deploy (sslip.io + Caddy).
#
# Two containers on a private compose network:
#   app   — the Streamlit dashboard (built from the repo-root Dockerfile),
#           listening on 8501, NOT published to the host.
#   caddy — reverse proxy on :80/:443, auto-obtains a Let's Encrypt cert for
#           $SITE_ADDRESS and proxies to app:8501 (WebSocket upgrade included).
#
# Hostname = <vm-public-ip>.sslip.io (magic DNS, no signup, no updater). If the
# VM's public IP changes, update SITE_ADDRESS + [auth] redirect_uri + the
# Google console URI — or reserve a static IP (free) to avoid it.
#
# Requires ports 80 + 443 open: Oracle VCN security-list ingress AND host
# iptables (see deploy/README.md). Caddy needs both for the ACME challenge.
#
# Secrets: bind-mount the real .streamlit/secrets.toml (app reads it directly).
# SITE_ADDRESS comes from deploy/.env (see .env.example).
#
# Run on the VM:  docker compose -f deploy/docker-compose.yml up -d --build

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: topstocks:latest
    restart: unless-stopped
    expose:
      - "8501" # compose-network only; Caddy reaches it as app:8501
    volumes:
      - ./secrets.toml:/app/.streamlit/secrets.toml:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env, e.g. 152-70-1-2.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # persists the issued cert across restarts (avoid LE rate limits)
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy # gated on the Dockerfile HEALTHCHECK

volumes:
  caddy_data:
  caddy_config:
