#cloud-config
# Oracle Cloud first-boot provisioning for the Aguait Stocks VM.
# Paste into the Instance -> Advanced -> Management -> "cloud-init script" box
# when creating the VM (or `oci compute instance launch --user-data-file`).
#
# Installs Docker + compose plugin and opens nothing inbound (Cloudflare Tunnel
# dials out). Ubuntu 24.04 ARM (Canonical-Ubuntu-24.04-aarch64) assumed.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git

runcmd:
  # --- Docker Engine + compose plugin (official convenience script) ---
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ubuntu
  # --- Open 80/443 on the host firewall for Caddy's ACME challenge + HTTPS.
  #     Oracle Ubuntu images ship an iptables ruleset whose INPUT chain ends in
  #     a REJECT; insert ACCEPTs above it (position 6 = after the established/
  #     related rules) and persist. The VCN security list must ALSO allow them.
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - netfilter-persistent save || true
  - systemctl enable --now docker
  # --- Clone the repo so `docker compose build` has the source ---
  - git clone https://github.com/ignasisant/AguaitStocks.git /opt/aguait-stocks
  - chown -R ubuntu:ubuntu /opt/aguait-stocks

# After boot, SSH in as `ubuntu` and finish:
#   cd /opt/aguait-stocks/deploy
#   cp .env.example .env             # set SITE_ADDRESS + DUCKDNS_SUBDOMAIN/TOKEN
#   cp ~/secrets.toml secrets.toml   # your real .streamlit/secrets.toml (scp'd up)
#   docker compose up -d --build
